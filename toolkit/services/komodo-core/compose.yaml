services:
  komodo-core:
    restart: unless-stopped
    profiles:
    - management
    - svc-komodo
    image: ghcr.io/moghtech/komodo-core:2.2.0@sha256:7afbcfa99674bf3f51539ec3aa7235795e9b994af9b7099a6c4c654d5d8a5b6b
    container_name: komodo-core
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cap_drop:
    - ALL
    depends_on:
      komodo-mongo:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME:-komodo}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_LOCAL_AUTH: 'true'
      KOMODO_INIT_ADMIN_USERNAME: admin
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_DISABLE_USER_REGISTRATION: 'true'
      KOMODO_OIDC_ENABLED: 'true'
      KOMODO_OIDC_PROVIDER: ${PUBLIC_URL_PROTOCOL:-https}://auth.${BASE_DOMAIN:-localhost}
      KOMODO_OIDC_CLIENT_ID: komodo
      KOMODO_OIDC_CLIENT_SECRET: ${KOMODO_OIDC_CLIENT_SECRET:-}
    expose:
    - 9120
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:9120:9120
    volumes:
    - komodo-keys:/config/keys
    labels:
      komodo.skip: 'true'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:9120 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
