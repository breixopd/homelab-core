---
- name: Apply manifest-owned security integrations to guest LXCs
  hosts: guest_hosts
  gather_facts: false
  become: true
  pre_tasks:
    - name: Wait for guest SSH before security reconciliation
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5
        sleep: 5
    - name: Gather facts after guest connection is stable
      ansible.builtin.setup:
  vars:
    homelab_controller_root: "{{ playbook_dir }}/../../.."
  tasks:
    - name: Apply manifest-selected service security task file
      ansible.builtin.include_tasks: "{{ homelab_controller_root }}/{{ service_task_file }}"
      loop: "{{ service_security_task_files | default([]) }}"
      loop_control:
        loop_var: service_task_file
        label: "{{ service_task_file }}"
