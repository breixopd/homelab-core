services:
  plex:
    restart: unless-stopped
    profiles:
    - media-plex
    - svc-plex
    image: plexinc/pms-docker:1.43.2.10687-563d026ea@sha256:c37106c57fed7a6624f5dee5a3ce460ff011f09a2aa7f4ee9e8dbbd08ae1b87e
    container_name: plex
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    - FOWNER
    tmpfs:
    - /tmp
    - /run
    - /var/run
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      ADVERTISE_IP: http://${PRIVATE_IP:-127.0.0.1}:32400/
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:32400:32400
    volumes:
    - ${PLEX_CONFIG_SOURCE:-./data/plex/config}:/config
    - ${MEDIA_LIBRARY_ROOT:-./media}:/data
    - ${PLEX_TRANSCODE_SOURCE:-./data/plex/transcode}:/transcode
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://127.0.0.1:32400/ || curl -sf http://127.0.0.1:32400/web/index.html || exit 1
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 300s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 1024
  plex-nvidia:
    restart: unless-stopped
    profiles:
    - media-plex-nvidia
    image: plexinc/pms-docker:1.43.2.10687-563d026ea@sha256:c37106c57fed7a6624f5dee5a3ce460ff011f09a2aa7f4ee9e8dbbd08ae1b87e
    container_name: plex-nvidia
    read_only: true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      ADVERTISE_IP: http://${PRIVATE_IP:-127.0.0.1}:32400/
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    runtime: nvidia
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:32400:32400
    volumes:
    - ${PLEX_CONFIG_SOURCE:-./data/plex/config}:/config
    - ${MEDIA_LIBRARY_ROOT:-./media}:/data
    - ${PLEX_TRANSCODE_SOURCE:-./data/plex/transcode}:/transcode
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:32400/identity || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 1024
  plex-vaapi:
    restart: unless-stopped
    profiles:
    - media-plex-vaapi
    image: plexinc/pms-docker:1.43.2.10687-563d026ea@sha256:c37106c57fed7a6624f5dee5a3ce460ff011f09a2aa7f4ee9e8dbbd08ae1b87e
    container_name: plex-vaapi
    read_only: true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      ADVERTISE_IP: http://${PRIVATE_IP:-127.0.0.1}:32400/
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:32400:32400
    volumes:
    - ${PLEX_CONFIG_SOURCE:-./data/plex/config}:/config
    - ${MEDIA_LIBRARY_ROOT:-./media}:/data
    - ${PLEX_TRANSCODE_SOURCE:-./data/plex/transcode}:/transcode
    devices:
    - /dev/dri:/dev/dri
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:32400/identity || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 1024
