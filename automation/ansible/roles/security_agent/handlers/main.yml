---
- name: Restart fail2ban
  listen: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  become: true

- name: Restart SSH daemon
  listen: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted
  become: true

- name: Restart Wazuh agent
  listen: restart wazuh-agent
  ansible.builtin.systemd:
    name: wazuh-agent
    state: restarted
  become: true
