services:
  sonarr:
    restart: unless-stopped
    profiles:
    - media
    - svc-sonarr
    image: lscr.io/linuxserver/sonarr:4.0.19@sha256:4b025354d338999e03bf6dbdadcdde94815d39d4a5aba5de3cdc86a56d7d6c51
    container_name: sonarr
    depends_on:
      prowlarr:
        condition: service_healthy
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    - FOWNER
    tmpfs:
    - /tmp
    - /run:exec
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ:-UTC}
      SONARR__Auth__ApiKey: ${SONARR_API_KEY}
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:8989:8989
    volumes:
    - ${SONARR_CONFIG_SOURCE:-./data/sonarr/config}:/config
    - ${INSTALL_ROOT}/media:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8989/ping
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
