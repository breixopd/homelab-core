name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.29"

jobs:
  quality:
    name: Python quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked development environment
        run: uv sync --locked --all-extras
      - name: Verify lockfile
        run: uv lock --check
      - name: Compile Python sources
        run: uv run --locked python -m compileall -q toolkit tests scripts
      - name: Lint
        run: uv run --locked ruff check toolkit tests scripts
      - name: Check formatting
        run: uv run --locked ruff format --check toolkit tests scripts
      - name: Type check
        run: uv run --locked mypy --ignore-missing-imports toolkit/core toolkit/cli toolkit/webui toolkit/controller
      - name: Build and inspect wheel
        run: |
          uv build --wheel --out-dir dist
          uv run --locked python scripts/check-wheel-contents.py dist/*.whl
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --output-file /tmp/runtime-requirements.txt
          uv run --locked pip-audit --strict --require-hashes --requirement /tmp/runtime-requirements.txt

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    env:
      HOMELAB_CADDY_SKIP_IMAGE_PULL: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Sync locked test environment
        run: uv sync --locked --extra test
      - name: Run unit tests
        run: uv run --locked pytest tests/framework -q --tb=short --timeout=60

  service-test:
    name: Service plugin tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked test environment
        run: uv sync --locked --extra test
      - name: Run service-owned plugin tests
        run: uv run --locked pytest tests/services -q --tb=short --timeout=120

  coverage:
    name: Coverage policy
    needs: quality
    runs-on: ubuntu-latest
    env:
      HOMELAB_CADDY_SKIP_IMAGE_PULL: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked test environment
        run: uv sync --locked --extra test
      - name: Enforce coverage threshold
        run: |
          # Ratchet from the measured public baseline; never lower this value.
          uv run --locked pytest tests/framework \
            --cov=toolkit.core.config \
            --cov=toolkit.core.secrets \
            --cov=toolkit.core.generate \
            --cov=toolkit.core.deploy \
            --cov=toolkit.core.ops \
            --cov=toolkit.core.compose \
            --cov=toolkit.core.infra \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=45 \
            -q --tb=short --timeout=60
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  e2e:
    name: Web UI ASGI smoke tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked test environment
        run: uv sync --locked --all-extras
      - name: Run E2E tests
        run: uv run --locked pytest tests/e2e -q --timeout=120 -m e2e

  source-validation:
    name: Generated config, installer, and Ansible validation
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked test environment
        run: uv sync --locked --extra test
      - name: Install checksum-pinned secret tooling
        run: ./scripts/install-ci-secret-tools.sh
      - name: Prepare ephemeral operator identity
        run: ./scripts/prepare-ci-config.sh
      - name: Generate and validate deployment model
        run: uv run --locked homelab-toolkit --root . generate
      - name: Lint Ansible sources
        env:
          ANSIBLE_CONFIG: automation/ansible/ansible.cfg
        run: |
          uv run --locked ansible-lint --project-dir automation/ansible automation/ansible
          mapfile -t service_hooks < <(find toolkit/services -type f -path '*/ansible/*.yml' -print | sort)
          if ((${#service_hooks[@]})); then
            uv run --locked ansible-lint --project-dir automation/ansible "${service_hooks[@]}"
          fi
      - name: Run installer tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats
          bats tests/install.bats
      - name: Run clean-install smoke test
        run: ./scripts/install.sh --preset all --smoke-test --yes
      - name: Validate repository Compose model
        run: |
          set -a
          . generated/infra/.env
          set +a
          INSTALL_ROOT="$PWD" docker compose --env-file .smoke-test/.env config --quiet

  tofu-validate:
    name: OpenTofu validation
    needs: quality
    runs-on: ubuntu-latest
    env:
      HOMELAB_CADDY_SKIP_IMAGE_PULL: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.4
      - name: Sync locked runtime environment
        run: uv sync --locked
      - name: Install checksum-pinned secret tooling
        run: ./scripts/install-ci-secret-tools.sh
      - name: Prepare ephemeral operator identity
        run: ./scripts/prepare-ci-config.sh
      - name: Generate infrastructure inputs
        run: uv run --locked homelab-toolkit --root . generate
      - name: Validate OpenTofu configuration
        working-directory: infrastructure
        run: |
          tofu init -backend=false
          tofu validate

  integration:
    name: Clean-root CLI integration
    needs: quality
    runs-on: ubuntu-latest
    env:
      HOMELAB_CADDY_SKIP_IMAGE_PULL: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked runtime environment
        run: uv sync --locked
      - name: Install checksum-pinned secret tooling
        run: ./scripts/install-ci-secret-tools.sh
      - name: Exercise clean-root lifecycle
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          uv run --locked python -m toolkit.cli --root "$root" config init
          uv run --locked python -m toolkit.cli --root "$root" config set dns.public_ip=192.0.2.10
          uv run --locked python -m toolkit.cli --root "$root" secrets generate
          uv run --locked python -m toolkit.cli --root "$root" generate
          uv run --locked python -m toolkit.cli --root "$root" status

  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history
        run: >-
          docker run --rm
          --volume "${PWD}:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --log-opts="--all" /repo

  image-plan:
    name: Compile service-owned image plan
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked runtime environment
        run: uv sync --locked
      - name: Compile image build plan
        id: plan
        run: printf 'images=%s\n' "$(uv run --locked python -m toolkit.cli --root . images list --ci --json)" >> "$GITHUB_OUTPUT"

  custom-images:
    name: Build and verify ${{ matrix.image.name }}
    if: github.event_name == 'pull_request'
    needs: [image-plan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.image-plan.outputs.images) }}
    env:
      IMAGE_NAME: ${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked runtime environment
        run: uv sync --locked
      - name: Build image
        run: uv run --locked python -m toolkit.cli --root . images build --image "$IMAGE_NAME" --registry local --tag test
      - name: Smoke test image
        run: uv run --locked python -m toolkit.cli --root . images test --image "$IMAGE_NAME" --registry local --tag test
      - name: Audit image dependencies
        run: uv run --locked python -m toolkit.cli --root . images audit --image "$IMAGE_NAME"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build all declared platforms without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.image.platforms }}
          push: false

  custom-images-gate:
    name: Service-owned image verification
    if: always() && github.event_name == 'pull_request'
    needs: custom-images
    runs-on: ubuntu-latest
    steps:
      - name: Require every declared image check
        env:
          IMAGE_CHECK_RESULT: ${{ needs.custom-images.result }}
        run: |
          if [[ "$IMAGE_CHECK_RESULT" != "success" ]]; then
            echo "Service-owned image verification result: $IMAGE_CHECK_RESULT" >&2
            exit 1
          fi

  publish-images:
    name: Publish ${{ matrix.image.name }}
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - image-plan
      - test
      - coverage
      - e2e
      - source-validation
      - tofu-validate
      - integration
      - gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Publish service-owned images only for an explicit release tag.
      id-token: write # Exchange an OIDC token for provenance signing.
      attestations: write # Attach build provenance to published images.
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.image-plan.outputs.images) }}
    env:
      IMAGE_NAME: ${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked runtime environment
        run: uv sync --locked
      - name: Build image
        run: uv run --locked python -m toolkit.cli --root . images build --image "$IMAGE_NAME" --registry local --tag test
      - name: Smoke test image
        run: uv run --locked python -m toolkit.cli --root . images test --image "$IMAGE_NAME" --registry local --tag test
      - name: Audit image dependencies
        run: uv run --locked python -m toolkit.cli --root . images audit --image "$IMAGE_NAME"
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Compile immutable image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.repository }}
        run: |
          {
            echo 'value<<EOF'
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            echo "${IMAGE}:latest"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "${IMAGE}:${GITHUB_REF_NAME}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Build and publish multi-platform image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.image.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Attest published image provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
