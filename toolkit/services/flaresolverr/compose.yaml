services:
  flaresolverr:
    restart: unless-stopped
    profiles:
    - media
    - svc-flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    container_name: flaresolverr
    user: ${PUID}:${PGID}
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    shm_size: 256m
    tmpfs:
    - /tmp
    - /run
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
      LOG_HTML: 'false'
      CAPTCHA_SOLVER: none
    expose:
    - 8191
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8191/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 512
