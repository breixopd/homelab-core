services:
  loki:
    restart: unless-stopped
    profiles:
    - management
    - svc-loki
    build:
      context: ./toolkit/services/loki/image
    image: ${HOMELAB_LOKI_IMAGE:?run homelab-toolkit generate}
    container_name: loki
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - DAC_OVERRIDE
    - CHOWN
    - FOWNER
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: -config.file=/etc/loki/loki.yml
    expose:
    - 3100
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:3100:3100
    volumes:
    - ${LOKI_DATA_SOURCE:-./data/loki}:/loki
    - ${INSTALL_ROOT}/config/loki/loki.yml:/etc/loki/loki.yml:ro
    healthcheck:
      test:
      - CMD
      - /bin/busybox
      - wget
      - -q
      - --spider
      - http://localhost:3100/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
