services:
  registry-mirror:
    restart: unless-stopped
    profiles:
    - management
    - svc-registry-mirror
    image: rpardini/docker-registry-proxy:0.7.0@sha256:413c340ea5f827345434e0f0656eff97f266ae7f9cde089f5dc2d6af42ea3f77
    container_name: registry-mirror
    x-homelab:
      stagger:
        priority: 0
        group: registry-mirror
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    - CHOWN
    - SETGID
    - SETUID
    - DAC_OVERRIDE
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:3128:3128
    environment:
      ENABLE_MANIFEST_CACHE: 'true'
      TZ: ${TZ:-UTC}
    volumes:
    - docker_mirror_cache:/docker_mirror_cache
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:3128/ca.crt || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
