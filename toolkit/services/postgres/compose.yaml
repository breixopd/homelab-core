services:
  postgres:
    restart: unless-stopped
    profiles:
    - management
    - svc-postgres
    image: pgvector/pgvector:0.8.5-pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    container_name: postgres
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    - FOWNER
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: ${TZ:-UTC}
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:5432:5432
    volumes:
    - ${POSTGRES_DATA_SOURCE:-./data/postgres}:/var/lib/postgresql/data
    command:
    - postgres
    - -c
    - shared_buffers=256MB
    - -c
    - effective_cache_size=512MB
    - -c
    - work_mem=16MB
    - -c
    - maintenance_work_mem=128MB
    - -c
    - max_connections=200
    - -c
    - wal_level=replica
    - -c
    - max_wal_size=1GB
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-admin}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2048m
    cpus: 2.0
    pids_limit: 256
