services:
  alloy:
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    container_name: alloy
    restart: unless-stopped
    profiles:
    - management
    - svc-alloy
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - DAC_OVERRIDE
    tmpfs:
    - /tmp
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - --storage.path=/var/lib/alloy/data
    - /etc/alloy/config.alloy
    environment:
      ALLOY_NODE_ROLE: ${HOMELAB_NODE:-infra}
      ALLOY_LOKI_URL: http://${ALLOY_LOKI_HOST}:${ALLOY_LOKI_PORT}/loki/api/v1/push
      ALLOY_DOCKER_HOST: http://alloy-docker-proxy:2375
    volumes:
    - ${INSTALL_ROOT}/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    - ${ALLOY_DATA_SOURCE:-./data/alloy}:/var/lib/alloy/data
    networks:
    - alloy-docker-api
    depends_on:
      loki:
        condition: service_started
      alloy-docker-proxy:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - /usr/bin/bash -ec "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/healthy HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128

  alloy-agent:
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    container_name: alloy-agent
    restart: unless-stopped
    profiles:
    - monitoring-agent
    - svc-alloy-agent
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - DAC_OVERRIDE
    tmpfs:
    - /tmp
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - --storage.path=/var/lib/alloy/data
    - /etc/alloy/config.alloy
    environment:
      ALLOY_NODE_ROLE: ${HOMELAB_NODE}
      ALLOY_LOKI_URL: http://${ALLOY_LOKI_HOST}:${ALLOY_LOKI_PORT}/loki/api/v1/push
      ALLOY_DOCKER_HOST: http://alloy-agent-docker-proxy:2375
    volumes:
    - ${INSTALL_ROOT}/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    - ${ALLOY_DATA_SOURCE:-./data/alloy}:/var/lib/alloy/data
    networks:
    - alloy-docker-api
    depends_on:
      alloy-agent-docker-proxy:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - /usr/bin/bash -ec "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/healthy HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  alloy-docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: alloy-docker-proxy
    restart: unless-stopped
    profiles:
    - management
    - svc-alloy
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    - /run
    environment:
      CONTAINERS: '1'
      EVENTS: '1'
      NETWORKS: '1'
      POST: '0'
      LOG_LEVEL: warning
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - alloy-docker-api
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32

  alloy-agent-docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: alloy-agent-docker-proxy
    restart: unless-stopped
    profiles:
    - monitoring-agent
    - svc-alloy-agent
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    - /run
    environment:
      CONTAINERS: '1'
      EVENTS: '1'
      NETWORKS: '1'
      POST: '0'
      LOG_LEVEL: warning
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - alloy-docker-api
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32

networks:
  alloy-docker-api:
    internal: true
