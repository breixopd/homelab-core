services:
  tautulli:
    restart: unless-stopped
    profiles:
    - media-plex
    - media-plex-nvidia
    - media-plex-vaapi
    - svc-tautulli
    image: tautulli/tautulli:v2.17.2@sha256:864245fb24830ef6516b5f383bf4d8ba37939ae2f0574dc0217ca02fba4301ff
    container_name: tautulli
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - FOWNER
    tmpfs:
    - /tmp
    - /run
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ:-UTC}
    expose:
    - 8181
    volumes:
    - ${TAUTULLI_CONFIG_SOURCE:-./data/tautulli/config}:/config
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8181/status || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
