name: immich-machine-learning
label: Immich ML
description: "Face detection + search (GPU-adaptive: CUDA/OpenVINO/CPU)"
icon: 🧠
category: cloud
placement: apps
priority: 30
restart_policy: safe
depends_on:
- immich-server
memory_tier: heavy
health:
  starting_policy: pending
host_sources:
