services:
  gitea:
    restart: unless-stopped
    profiles:
    - dev
    - svc-gitea
    image: gitea/gitea:1.27.0-rootless@sha256:414ba5b2b1163480e9ed4213a989cd798579cfa88582a2359303273009b2b852
    container_name: gitea
    cap_drop:
    - ALL
    cap_add:
    - DAC_OVERRIDE
    - CHOWN
    - FOWNER
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: ${GITEA_DB_HOST}:${GITEA_DB_PORT}
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__server__DOMAIN: ${GITEA_HOST}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL}
      GITEA__server__SSH_DOMAIN: ${GITEA_HOST}
      GITEA__server__START_SSH_SERVER: 'false'
      GITEA__server__DISABLE_SSH: 'true'
      GITEA__actions__ENABLED: 'true'
      GITEA__actions__DEFAULT_ACTIONS_URL: github
      GITEA__packages__ENABLED: 'true'
      GITEA__packages__CONTAINER__ENABLED: 'true'
      GITEA__repository__DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects,repo.packages,repo.actions
      GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: 'true'
      GITEA__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: 'true'
      GITEA__service__ENABLE_REVERSE_PROXY_EMAIL: 'true'
      GITEA__service__ENABLE_REVERSE_PROXY_FULL_NAME: 'true'
      GITEA__security__REVERSE_PROXY_AUTHENTICATION_USER: Remote-User
      GITEA__security__REVERSE_PROXY_AUTHENTICATION_EMAIL: Remote-Email
      GITEA__security__REVERSE_PROXY_AUTHENTICATION_FULL_NAME: Remote-Name
      GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: ${GITEA_TRUSTED_PROXIES}
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:3000:3000
    volumes:
    - ${GITEA_DATA_SOURCE:-./data/gitea}:/var/lib/gitea
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:3000/api/healthz || exit 1
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
