services:
  uptime-kuma:
    restart: unless-stopped
    profiles:
    - notifications
    - svc-uptime-kuma
    image: louislam/uptime-kuma:2.4.0@sha256:91e963bfda569ba115206e843febb446f473ab525add4e08b2b9e3beffa16985
    container_name: uptime-kuma
    volumes:
    - ${UPTIME_KUMA_DATA_SOURCE:-./data/uptime-kuma}:/app/data
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:3001:3001
    expose:
    - '3001'
    environment:
      TZ: ${TZ:-UTC}
      UPTIME_KUMA_DB_TYPE: sqlite
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://localhost:3001'', (r) => process.exit(r.statusCode === 200 || r.statusCode === 302
        ? 0 : 1)).on(''error'', () => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
