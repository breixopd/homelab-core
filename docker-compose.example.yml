# ------------------------------------------------------------------------------
# Generated deployment model
# Built from toolkit/services/*/compose.yaml and stacks/platform.yaml.
# Edit those sources, then run `homelab-toolkit generate`.
# ------------------------------------------------------------------------------
name: homelab
services:
  adguard:
    restart: unless-stopped
    profiles:
    - management
    - svc-adguard
    image: adguard/adguardhome:v0.107.78@sha256:1ea34eafe5dc691007946e8eaab7bf46b0de9412f39213d8c06e48b53bf9a6c5
    container_name: adguard
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    tmpfs:
    - /tmp
    - /opt/adguardhome/work/session
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
    expose:
    - 3000
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:53:53/tcp
    - ${PRIVATE_IP:-127.0.0.1}:53:53/udp
    - ${PRIVATE_IP:-127.0.0.1}:3003:3000
    volumes:
    - ${ADGUARD_CONFIG_SOURCE:-./data/adguard/config}:/opt/adguardhome/conf
    - ${ADGUARD_WORK_SOURCE:-./data/adguard/work}:/opt/adguardhome/work
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:3000/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    networks:
    - plugin-adguard
  alloy:
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    container_name: alloy
    restart: unless-stopped
    profiles:
    - management
    - svc-alloy
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - DAC_OVERRIDE
    tmpfs:
    - /tmp
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - --storage.path=/var/lib/alloy/data
    - /etc/alloy/config.alloy
    environment:
      ALLOY_NODE_ROLE: ${HOMELAB_NODE:-infra}
      ALLOY_LOKI_URL: http://${ALLOY_LOKI_HOST}:${ALLOY_LOKI_PORT}/loki/api/v1/push
      ALLOY_DOCKER_HOST: http://alloy-docker-proxy:2375
    volumes:
    - ${INSTALL_ROOT}/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    - ${ALLOY_DATA_SOURCE:-./data/alloy}:/var/lib/alloy/data
    networks:
    - alloy-docker-api
    - plugin-alloy
    - link-alloy-loki
    depends_on:
      loki:
        condition: service_started
      alloy-docker-proxy:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - /usr/bin/bash -ec "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/healthy HTTP/1.0\\r\\n\\r\\n' >&3 && head -n
        1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
  alloy-agent:
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    container_name: alloy-agent
    restart: unless-stopped
    profiles:
    - monitoring-agent
    - svc-alloy-agent
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - DAC_OVERRIDE
    tmpfs:
    - /tmp
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - --storage.path=/var/lib/alloy/data
    - /etc/alloy/config.alloy
    environment:
      ALLOY_NODE_ROLE: ${HOMELAB_NODE}
      ALLOY_LOKI_URL: http://${ALLOY_LOKI_HOST}:${ALLOY_LOKI_PORT}/loki/api/v1/push
      ALLOY_DOCKER_HOST: http://alloy-agent-docker-proxy:2375
    volumes:
    - ${INSTALL_ROOT}/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    - ${ALLOY_DATA_SOURCE:-./data/alloy}:/var/lib/alloy/data
    networks:
    - alloy-docker-api
    - plugin-alloy
    - link-alloy-loki
    depends_on:
      alloy-agent-docker-proxy:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - /usr/bin/bash -ec "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/healthy HTTP/1.0\\r\\n\\r\\n' >&3 && head -n
        1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
  alloy-docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: alloy-docker-proxy
    restart: unless-stopped
    profiles:
    - management
    - svc-alloy
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    - /run
    environment:
      CONTAINERS: '1'
      EVENTS: '1'
      NETWORKS: '1'
      POST: '0'
      LOG_LEVEL: warning
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - alloy-docker-api
    - plugin-alloy
    - link-alloy-loki
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32
  alloy-agent-docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: alloy-agent-docker-proxy
    restart: unless-stopped
    profiles:
    - monitoring-agent
    - svc-alloy-agent
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    - /run
    environment:
      CONTAINERS: '1'
      EVENTS: '1'
      NETWORKS: '1'
      POST: '0'
      LOG_LEVEL: warning
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - alloy-docker-api
    - plugin-alloy
    - link-alloy-loki
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32
  authelia:
    restart: unless-stopped
    profiles:
    - management
    - svc-authelia
    image: authelia/authelia:4.39.20@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b
    container_name: authelia
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lldap:
        condition: service_healthy
    env_file:
    - ${INSTALL_ROOT:-.}/generated/authelia/notifier.env
    environment:
      TZ: ${TZ:-UTC}
      PUID: '1000'
      PGID: '1000'
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_KEY}
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: tcp://${AUTHELIA_DB_HOST}:${AUTHELIA_DB_PORT}
      AUTHELIA_STORAGE_POSTGRES_DATABASE: ${AUTHELIA_DB_NAME}
      AUTHELIA_STORAGE_POSTGRES_USERNAME: ${AUTHELIA_DB_USER}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${AUTHELIA_DB_PASSWORD}
      AUTHELIA_SESSION_REDIS_HOST: ${AUTHELIA_REDIS_HOST}
      AUTHELIA_SESSION_REDIS_PORT: ${AUTHELIA_REDIS_PORT}
      AUTHELIA_SESSION_REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
    - 9091
    - 9959
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:9091:9091
    volumes:
    - ${AUTHELIA_CONFIG_SOURCE:-./generated/authelia}:/config:ro
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9091/api/health >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 256
    networks:
    - plugin-authelia
    - link-authelia-lldap
    - link-authelia-postgres
    - link-authelia-redis
    - link-authelia-mailserver
    - link-authelia-komodo-core
    - link-authelia-headscale
    - link-authelia-grafana
  bazarr:
    restart: unless-stopped
    profiles:
    - media
    - svc-bazarr
    image: lscr.io/linuxserver/bazarr:1.6.0@sha256:4c30dc0bb9a5d223075e7f5d12c77bd293c4b460f86d696dbe64763104c1e88c
    container_name: bazarr
    read_only: false
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    - FOWNER
    tmpfs:
    - /tmp
    - /run:exec
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ:-UTC}
      UMASK_SET: '022'
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:6767:6767
    volumes:
    - ${BAZARR_CONFIG_SOURCE:-./data/bazarr/config}:/config
    - ${INSTALL_ROOT}/media:/data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:6767/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 512
    networks:
    - plugin-bazarr
    - link-bazarr-sonarr
    - link-bazarr-radarr
  caddy:
    restart: unless-stopped
    networks:
      caddy-egress:
        ipv4_address: ${CADDY_EDGE_IP:-172.31.250.2}
    profiles:
    - management
    - svc-caddy
    build:
      context: ./toolkit/services/caddy/image
    image: ${HOMELAB_CADDY_IMAGE:?run homelab-toolkit generate}
    container_name: caddy
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    - DAC_OVERRIDE
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CADDY_BOUNCER_API_KEY: ${CADDY_BOUNCER_API_KEY:-}
    ports:
    - target: 80
      published: 80
      host_ip: ${CADDY_BIND_ADDRESS:-${PRIVATE_IP:-127.0.0.1}}
    - target: 443
      published: 443
      host_ip: ${CADDY_BIND_ADDRESS:-${PRIVATE_IP:-127.0.0.1}}
    volumes:
    - ${GENERATED_CADDYFILE:-./generated/Caddyfile}:/etc/caddy/Caddyfile:ro
    - ${CADDY_DATA_SOURCE:-./data/caddy}:/data
    - ${CADDY_CONFIG_SOURCE:-./data/caddy/config}:/config
    - ${CADDY_ACCESS_LOG_SOURCE:-./data/caddy-access}:/var/log/caddy
    - ${PORTAL_CONTENT_SOURCE:-./generated/portal}:/srv/portal:ro
    depends_on:
      authelia:
        condition: service_healthy
      crowdsec:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 256
  cadvisor:
    restart: unless-stopped
    profiles:
    - management
    - svc-cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    read_only: true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - --housekeeping_interval=30s
    - --docker_only=true
    - --store_container_labels=false
    - --whitelisted_container_labels=com.docker.compose.service
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    expose:
    - 8080
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:8089:8080
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:8080/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    networks:
    - plugin-cadvisor
  cadvisor-agent:
    restart: unless-stopped
    profiles:
    - monitoring-agent
    - svc-cadvisor-agent
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor-agent
    read_only: true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - --housekeeping_interval=30s
    - --docker_only=true
    - --store_container_labels=false
    - --whitelisted_container_labels=com.docker.compose.service
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:8088:8080
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:8080/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    networks:
    - plugin-cadvisor
  crowdsec:
    restart: unless-stopped
    profiles:
    - security-headscale
    - svc-crowdsec
    image: crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    container_name: crowdsec
    environment:
      TZ: ${TZ:-UTC}
      COLLECTIONS: crowdsecurity/caddy crowdsecurity/base-http-scenarios
      BOUNCER_KEY_caddy: ${CROWDSEC_CADDY_BOUNCER_KEY:?CrowdSec Caddy bouncer key is required}
    volumes:
    - ${CROWDSEC_DATA_SOURCE:-./data/crowdsec}:/var/lib/crowdsec/data
    - ${CROWDSEC_CONFIG_SOURCE:-./data/crowdsec/etc}:/etc/crowdsec
    - ${GENERATED_CROWDSEC_CONFIG_LOCAL:-./generated/crowdsec/config.yaml.local}:/etc/crowdsec/config.yaml.local:ro
    - ${GENERATED_CROWDSEC_ACQUISITION:-./generated/crowdsec/acquis.yaml}:/etc/crowdsec/acquis.yaml:ro
    - ${CROWDSEC_ACCESS_LOG_SOURCE:-./data/caddy-access}:/var/log/caddy:ro
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:8080:8080
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD-SHELL
      - set -- $(hostname -i); test -n "$1" && wget -qO- "http://$1:8080/health" 2>/dev/null | grep -Eq '"status"[[:space:]]*:[[:space:]]*"up"'
        && cscli lapi status >/dev/null 2>&1
      interval: 60s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - plugin-crowdsec
  dev-postgres:
    restart: unless-stopped
    profiles:
    - dev
    - svc-dev-postgres
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: dev-postgres
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    - FOWNER
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-dev}
      TZ: ${TZ:-UTC}
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:5433:5432
    volumes:
    - ${DEV_POSTGRES_DATA_SOURCE:-./data/dev-postgres}:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DEV_POSTGRES_USER:-dev}
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    networks:
    - plugin-dev-postgres
  dev-redis:
    restart: unless-stopped
    profiles:
    - dev
    - svc-dev-redis
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    container_name: dev-redis
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - DAC_OVERRIDE
    environment:
      TZ: ${TZ:-UTC}
      DEV_REDIS_PASSWORD: ${DEV_REDIS_PASSWORD:-}
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${DEV_REDIS_PASSWORD:-}
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:6380:6379
    volumes:
    - ${DEV_REDIS_DATA_SOURCE:-./data/dev-redis}:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="${DEV_REDIS_PASSWORD}" redis-cli ping | grep -q PONG || redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    networks:
    - plugin-dev-redis
  flaresolverr:
    restart: unless-stopped
    profiles:
    - media
    - svc-flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    container_name: flaresolverr
    user: ${PUID}:${PGID}
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    shm_size: 256m
    tmpfs:
    - /tmp
    - /run
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
      LOG_HTML: 'false'
      CAPTCHA_SOLVER: none
    expose:
    - 8191
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8191/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 512
    networks:
    - plugin-flaresolverr
    - link-flaresolverr-prowlarr
  fmd-server:
    restart: unless-stopped
    profiles:
    - cloud
    - svc-fmd-server
    image: registry.gitlab.com/fmd-foss/fmd-server:0.16.0-alpine@sha256:fec3cce3329468d806ddd1e33e48dff6eafe6005ef4168163abb3afc48d53330
    container_name: fmd-server
    init: true
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      FMD_PORTINSECURE: '8080'
      FMD_REGISTRATIONTOKEN: ${FMD_REGISTRATION_TOKEN}
      FMD_METRICSADDRPORT: 0.0.0.0:9100
      FMD_REMOTEIPHEADER: X-Real-IP
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:8084:8080
    - ${PRIVATE_IP:-127.0.0.1}:9101:9100
    volumes:
    - ${FMD_DATA_SOURCE:-./data/fmd}:/var/lib/fmd-server/db
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/api/v1/version >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks:
    - plugin-fmd-server
  gitea:
    restart: unless-stopped
    profiles:
    - dev
    - svc-gitea
    image: gitea/gitea:1.27.0-rootless@sha256:414ba5b2b1163480e9ed4213a989cd798579cfa88582a2359303273009b2b852
    container_name: gitea
    cap_drop:
    - ALL
    cap_add:
    - DAC_OVERRIDE
    - CHOWN
    - FOWNER
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: ${GITEA_DB_HOST}:${GITEA_DB_PORT}
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
