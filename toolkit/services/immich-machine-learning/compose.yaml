services:
  immich-machine-learning:
    restart: unless-stopped
    profiles:
    - cloud
    - svc-immich-server
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5@sha256:a2501141440f10516d329fdfba2c68082e19eb9ba6016c061ac80d23beadf7f3
    container_name: immich-machine-learning
    read_only: true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
    volumes:
    - ${IMMICH_ML_CACHE_SOURCE:-./data/immich-ml}:/cache
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c 'import urllib.request; urllib.request.urlopen("http://localhost:3003/ping")' 2>/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
