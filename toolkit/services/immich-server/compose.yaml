services:
  immich-server:
    restart: unless-stopped
    profiles:
    - cloud
    - svc-immich-server
    image: ghcr.io/immich-app/immich-server:v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
    container_name: immich-server
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      TZ: ${TZ:-UTC}
      DB_HOSTNAME: ${IMMICH_DB_HOST}
      DB_PORT: ${IMMICH_DB_PORT}
      DB_USERNAME: ${IMMICH_DB_USER}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      REDIS_HOSTNAME: immich-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${IMMICH_REDIS_PASSWORD}
      REDIS_DBINDEX: 3
      OAUTH_ENABLED: true
      OAUTH_ISSUER_URL: ${IMMICH_OAUTH_ISSUER_URL:-}
      OAUTH_CLIENT_ID: immich
      OAUTH_CLIENT_SECRET: ${IMMICH_OIDC_CLIENT_SECRET:-}
      OAUTH_AUTO_REGISTER: 'true'
      OAUTH_BUTTON_TEXT: Sign in with Authelia
    ports:
    - ${PRIVATE_IP:-127.0.0.1}:2283:2283
    volumes:
    - ${IMMICH_UPLOAD_SOURCE:-./data/immich-upload}:/usr/src/app/upload
    depends_on:
      immich-postgres:
        condition: service_healthy
        required: false
      immich-redis:
        condition: service_healthy
        required: false
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:2283/api/server/ping || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 1024
  immich-redis:
    restart: unless-stopped
    profiles:
    - cloud
    - svc-immich-server
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    container_name: immich-redis
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cap_drop:
    - ALL
    environment:
      REDIS_PASSWORD: ${IMMICH_REDIS_PASSWORD}
    command:
    - /bin/sh
    - -ec
    - exec redis-server --maxmemory-policy noeviction --requirepass "$${REDIS_PASSWORD}"
    tmpfs:
    - /data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
