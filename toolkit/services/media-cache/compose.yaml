services:
  media-cache:
    restart: unless-stopped
    profiles:
    - media-cache
    - svc-media-cache
    image: ghcr.io/breixopd/media-cache:v1.2.0@sha256:5659d9e46751ba8f9d7cbf2bc999d1318ef8c4d612aaaaecc55630bff6eef7a8
    container_name: media-cache
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
      MEDIA_CACHE_TOKEN: ${MEDIA_CACHE_TOKEN:?MEDIA_CACHE_TOKEN is required}
      MEDIA_CACHE_WEBHOOK_TOKEN: ${MEDIA_CACHE_WEBHOOK_TOKEN:?MEDIA_CACHE_WEBHOOK_TOKEN is required}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      CACHE_DIR: /cache
      LIBRARY_DIR: /library
      CACHE_MAX_GB: ${RCLONE_CACHE_MAX_GB:-500}
      COLD_AFTER_DAYS: ${COLD_AFTER_DAYS:-15}
      UPLINK_MBPS: ${UPLINK_MBPS:-0}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-media-union}
    volumes:
    - ${MEDIA_LIBRARY_ROOT:-./media}:/library:ro
    - ${INSTALL_ROOT}/media/cache:/cache
    - ${RCLONE_CONFIG_SOURCE:-./data/rclone/config}:/config/rclone:ro
    - media-cache-state:/state
    expose:
    - 8686
    depends_on:
      rclone:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8686/health/ready
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
